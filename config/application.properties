server.port=8883

# MySQL database configuration
spring.datasource.url=jdbc:mysql://192.168.1.48:3306/minutes?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ASR WebSocket address
asr.ws.url=ws://192.168.1.81:12436

# Robot configuration
robot.im_id=robotminutes
robot.im_url=http://192.168.1.81
robot.im_secret=123456

# Janus IP替换映射配置，格式: 公网IP1:内网IP1,公网IP2:内网IP2
# 用于替换SDP中的公网IP为内网IP
janus.ip.replace.map=

# 音频文件基础URL，用于拼接录音文件下载地址
# 例如: http://asr-server/audio/
audio.base.url=http://192.168.1.81/audio/

# 前端构建产物已输出到 src/main/resources/static/，Spring Boot 默认托管
# 开发时执行 cd web && npm run build 即可更新静态资源

# LLM configuration (OpenAI compatible API)
llm.api.url=https://api.moonshot.cn/v1/chat/completions
llm.api.key=sk-123456XXXX
llm.api.model=kimi-k2-turbo-preview
llm.api.max-context-length=220000
